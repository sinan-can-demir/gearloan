{% extends "base.html" %}
{% load static %}

{% block title %}Log in – GearLoan{% endblock %}

{% block content %}
<div class="login-card">
  <h1>GearLoan</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Log in</button>
  </form>
</div>
{% endblock %}
