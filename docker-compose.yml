version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: gearloan
      POSTGRES_USER: gearloan
      POSTGRES_PASSWORD: gearloan
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://gearloan:gearloan@db:5432/gearloan
    depends_on:
      - db

volumes:
  postgres_data:
