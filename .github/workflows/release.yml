name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Django system check
        env:
          DEBUG: "True"
          SECRET_KEY: ci-release-key
        run: python manage.py check

      - name: Check no missing migrations
        env:
          DEBUG: "True"
          SECRET_KEY: ci-release-key
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DEBUG: "True"
          SECRET_KEY: ci-release-key
        run: python manage.py test tests

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## GearLoan ${{ steps.meta.outputs.tag }}

            Docker image: `ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}`

            ### Quick start

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd gearloan
            cp .env.example .env
            # Set SECRET_KEY in .env
            docker compose up --build
            # Create first admin:
            docker compose exec web python manage.py createsuperuser
            ```

            ### What's in v1

            - Role-based borrower and admin interfaces
            - Two-level inventory: ItemType (rules) + Unit (physical copies with asset tags)
            - Booking lifecycle: request → approve → check-out → check-in with condition logs
            - Auto-approval rules per role × item type × course enrollment
            - Hold rule: overdue loans block new requests; per-role active loan limits
            - Late fees ($10/day) and damage charges up to replacement cost
            - CSV roster and inventory import
            - Email notifications (request status, due-date reminders, overdue notices)
            - Append-only audit log
            - 76 passing tests, GitHub Actions CI, Docker + PostgreSQL setup

            See [V1_PLAN.md](V1_PLAN.md) for full scope and [PATCH_NOTES_003.md](PATCH_NOTES_003.md) for the last batch of fixes.
